name: Daily Database Backup

on:
  schedule:
    - cron: '37 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot, verify and download database
        env:
          SSH_OPTS: -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # The server has shipped without the sqlite3 CLI before, which is why
          # every prior backup run failed; install it on demand.
          ssh $SSH_OPTS root@67.230.171.167 \
            "command -v sqlite3 >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq sqlite3)"

          # Rows written before the FSRS columns were added via ALTER TABLE
          # (nodes rowids 7-10) physically store fewer columns; reads
          # synthesize the DEFAULT, but sqlite3 3.45.x integrity_check flags
          # them as NOT NULL violations. UPDATE rewrites each record with the
          # full column set, materializing the defaults. Idempotent no-op
          # once every row is physically complete.
          ssh $SSH_OPTS root@67.230.171.167 \
            "sqlite3 /opt/acacia/data/acacia.db 'PRAGMA busy_timeout=5000; UPDATE nodes SET difficulty = COALESCE(difficulty, 0.3) WHERE true;'"

          # Consistent snapshot of the live database; safe while writers are
          # active, unlike copying the db file directly.
          ssh $SSH_OPTS root@67.230.171.167 \
            "sqlite3 /opt/acacia/data/acacia.db \".backup '/tmp/acacia-snapshot.db'\""

          # Download first: even when the integrity gate below fails, the
          # snapshot must land in the artifact so nothing is lost.
          scp $SSH_OPTS root@67.230.171.167:/tmp/acacia-snapshot.db ./acacia.db

          # TEMPORARY diagnostics: compare the exact same snapshot bytes on
          # both sides (md5), count real NULLs in the difficulty column, and
          # run integrity_check on the runner's sqlite as a cross-version
          # reference. Remove once the gate disagreement is resolved.
          echo "runner sqlite3: $(sqlite3 --version)"
          echo "runner md5: $(md5sum ./acacia.db)"
          echo "runner NULL(difficulty): $(sqlite3 ./acacia.db 'SELECT COUNT(*) - COUNT(difficulty) FROM nodes')"
          echo "runner integrity: $(sqlite3 ./acacia.db 'PRAGMA integrity_check')"
          ssh $SSH_OPTS root@67.230.171.167 \
            "md5sum /tmp/acacia-snapshot.db; sqlite3 --version; sqlite3 /tmp/acacia-snapshot.db 'SELECT COUNT(*) - COUNT(difficulty) FROM nodes'; sqlite3 /tmp/acacia-snapshot.db 'PRAGMA quick_check'"

          # Gate: integrity_check must return exactly one row, ok. Any other
          # output means the database violates its own schema — the artifact
          # above still preserves the data, but the job fails loudly.
          INTEGRITY=$(ssh $SSH_OPTS root@67.230.171.167 \
            "sqlite3 /tmp/acacia-snapshot.db 'PRAGMA integrity_check'")
          echo "integrity_check: $INTEGRITY"
          if [ "$INTEGRITY" != "ok" ]; then
            echo "::error::database failed integrity_check: $INTEGRITY"
            exit 1
          fi

          ssh $SSH_OPTS root@67.230.171.167 "rm -f /tmp/acacia-snapshot.db"

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acacia-db-backup
          path: ./acacia.db
          if-no-files-found: error
          retention-days: 30
